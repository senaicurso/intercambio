<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>França - Intercâmbio e Globalização</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #00078e 15%, #fff 50%, #900000 100%);
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        nav a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
        }

        /* BOTÕES FLUTUANTES */
        #btnMapa,
        #btnVoltarTopo,
        #btnChat {
            position: fixed;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 26px;
        }

        #btnMapa {
            bottom: 25px;
            left: 20px;
            background: linear-gradient(145deg, #910000, #b60000);
        }

        #btnChat {
            bottom: 90px;
            left: 20px;
            background: linear-gradient(145deg, #757575, #1a1818);
        }

        #btnVoltarTopo {
            bottom: 25px;
            right: 20px;
            background: linear-gradient(145deg, #003f91, #00266b);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: 0.3s;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 950px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.93);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* SLIDES */
        .slideshow-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            position: relative;
        }

        .slides {
            width: 100%;
            border-radius: 15px;
        }

        .mySlides {
            display: none;
        }

        .prev,
        .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            padding: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
            user-select: none;
        }

        .prev {
            left: 0;
        }

        .next {
            right: 0;
        }

        /* IMAGENS DAS COMIDAS */
        .comidas {
            width: 200px;
            height: auto;
            border-radius: 10px;
            margin: 10px;
        }

        .food-flex {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* MODAL MAPA */
        .modal,
        .modalChat {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 9999;
        }

        .modal-content {
            background: #fff;
            margin: 8% auto;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .fechar,
        .fecharChat {
            float: right;
            cursor: pointer;
            font-size: 28px;
        }

        /* CHAT */
        .modalChat-content {
            width: 90%;
            max-width: 350px;
            height: 80%;
            max-height: 520px;
            background: #fff;
            margin: auto;
            position: relative;
            top: 10%;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mensagens {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .opcoes {
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opcao {
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            background: linear-gradient(145deg, #007bff, #004aad);
            color: #fff;
            cursor: pointer;
        }

        .mensagem {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            max-width: 80%;
        }

        .bot {
            background: #e5e5e5;
        }

        .user {
            background: #007bff;
            color: #fff;
            margin-left: auto;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            margin-top: 30px;
        }

        /* MEDIA QUERIES – RESPONSIVIDADE GERAL */
        @media (max-width: 768px) {
            header h1 {
                font-size: 22px;
            }

            .container {
                margin: 10px;
                padding: 15px;
            }

            .prev,
            .next {
                font-size: 14px;
                padding: 10px;
            }

            #btnChat,
            #btnMapa {
                width: 50px;
                height: 50px;
            }

            #btnChat {
                bottom: 80px;
            }
        }

        @media (max-width: 480px) {

            .comidas {
                width: 150px;
            }

            header img {
                width: 22px;
            }

            nav ul {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- BOTÕES -->
    <button id="btnChat"><i class="material-icons">message</i></button>
    <button id="btnMapa"><i class="material-icons">location_on</i></button>
    <button id="btnVoltarTopo">
        <i class="material-icons">arrow_upward</i>
    </button>

    <!-- HEADER -->
    <header>
        <h1>França</h1>
        <img src="https://flagcdn.com/w40/fr.png" alt="França">
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="paises.html">Países</a></li>
            </ul>
        </nav>
    </header>

    <!-- MODAL MAPA -->
    <div id="modalMapa" class="modal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Localização</h2>
            <iframe src="https://www.google.com/maps/embed?...(seu mapa aqui)..."
                width="100%" height="350" style="border:0;" loading="lazy"></iframe>
        </div>
    </div>

    <!-- MODAL CHAT -->
    <div id="modalChat" class="modalChat">
        <div class="modalChat-content">
            <span class="fecharChat">&times;</span>

            <div class="header-chat" style="text-align:center; padding:10px; background:#0057c2; color:#fff;">
                <h3>BonjourBot</h3>
            </div>

            <div id="mensagens" class="mensagens">
                <div class="mensagem bot">
                    Olá! 👋 Escolha uma pergunta para saber mais sobre intercâmbio na França!
                </div>
            </div>

            <div id="opcoes" class="opcoes"></div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">

        <section class="country-info">
            <h2>Bem-vindo(a) à França</h2>

            <!-- SLIDES -->
            <div class="slideshow-container">
                <div class="mySlides fade">
                    <img src="images/paisagem_2.png" class="slides">
                </div>
                <div class="mySlides fade">
                    <img src="images/paisagem_3.png" class="slides">
                </div>
                <div class="mySlides fade">
                    <img src="images/paisagem_4.png" class="slides">
                </div>

                <div class="prev" onclick="plusSlides(-1)">&#10094;</div>
                <div class="next" onclick="plusSlides(1)">&#10095;</div>
            </div>

            <p style="padding:20px;">
                A França é conhecida por sua rica cultura, arte, moda e gastronomia...
            </p>

            <hr>

            <h2>Culinária 🥐</h2>

            <div class="food-flex">
                <img src="images/creme brule.png" class="comidas">
                <img src="images/croaisant.png" class="comidas">
                <img src="images/macaron.png" class="comidas">
            </div>

        </section>
    </div>

    <footer>
        <p>© 2025 Intercâmbio e Globalização - Projeto Escolar</p>
    </footer>

    <!-- JS (SLIDES, MODAIS, CHAT, BOTÃO TOPO) -->
    <script>
        /* SCRIPTS IGUAIS AO SEU – apenas reorganizados */
        let slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("mySlides");

            if (n > slides.length) slideIndex = 1;
            if (n < 1) slideIndex = slides.length;

            for (i = 0; i < slides.length; i++)
                slides[i].style.display = "none";

            slides[slideIndex - 1].style.display = "block";
        }

        /* MODAL MAPA */
        const btnMapa = document.getElementById("btnMapa");
        const modalMapa = document.getElementById("modalMapa");
        const fechar = document.querySelector(".fechar");

        btnMapa.onclick = () => modalMapa.style.display = "block";
        fechar.onclick = () => modalMapa.style.display = "none";

        window.onclick = (e) => {
            if (e.target === modalMapa) modalMapa.style.display = "none";
            if (e.target === modalChat) modalChat.style.display = "none";
        };

        /* BOTÃO VOLTAR AO TOPO */
        const btnTopo = document.getElementById("btnVoltarTopo");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 500) {
                btnTopo.style.opacity = "1";
                btnTopo.style.transform = "scale(1)";
                btnTopo.style.pointerEvents = "auto";
            } else {
                btnTopo.style.opacity = "0";
                btnTopo.style.pointerEvents = "none";
            }
        });
        btnTopo.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

        /* CHAT */
        const btnChat = document.getElementById("btnChat");
        const modalChat = document.getElementById("modalChat");
        const fecharChat = document.querySelector(".fecharChat");

        btnChat.onclick = () => modalChat.style.display = "block";
        fecharChat.onclick = () => modalChat.style.display = "none";

        const mensagens = document.getElementById("mensagens");
        const opcoesDiv = document.getElementById("opcoes");

        const perguntas = {
            "💰 Quanto custa o intercâmbio?": "Os valores variam conforme cidade e duração...",
            "📍 Quais cidades posso escolher?": "Paris, Lyon, Nice, Toulouse...",
            "⏳ Quanto tempo dura?": "De 2 semanas a 1 ano.",
            "🧾 Preciso de visto?": "Sim, para estadias acima de 90 dias.",
            "🗣 Preciso falar francês?": "Não! Existem cursos para iniciantes.",
            "🎓 Posso trabalhar lá?": "Sim, com visto de estudante."
        };

        Object.keys(perguntas).forEach(p => {
            const btn = document.createElement("button");
            btn.classList.add("opcao");
            btn.textContent = p;
            btn.onclick = () => enviarPergunta(p);
            opcoesDiv.appendChild(btn);
        });

        function addMsg(text, sender) {
            const div = document.createElement("div");
            div.classList.add("mensagem", sender);
            div.textContent = text;
            mensagens.appendChild(div);
            mensagens.scrollTop = mensagens.scrollHeight;
        }

        function enviarPergunta(p) {
            addMsg(p, "user");
            setTimeout(() => addMsg(perguntas[p], "bot"), 700);
        }
    </script>

</body>

</html>
